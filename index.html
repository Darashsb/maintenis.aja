```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIN TENIS AJA - Premium Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Updated River Blue */
        .bg-river { background-color: #73b0d9; } 
        .text-river { color: #73b0d9; }
        .border-river { border-color: #73b0d9; }
        
        /* Updated Highland Green */
        .bg-highland { background-color: #2d634f; }
        .text-highland { color: #2d634f; }
        .border-highland { border-color: #2d634f; }

        /* Dark Navy for Nav */
        .bg-navy { background-color: #0f172a; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        
        // URL Database Firebase
        const BASE_DB_URL = "https://main-tenis-database-default-rtdb.firebaseio.com/bookings";

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className} style={{width: size, height: size}}></i>;
        };

        const App = () => {
            const [view, setView] = useState('client');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showPassError, setShowPassError] = useState(false);
            const [showQrModal, setShowQrModal] = useState(false);
            const [successData, setSuccessData] = useState(null);
            const [bookings, setBookings] = useState([]);
            const [isLoading, setIsLoading] = useState(false);

            const ADMIN_PASSWORD = "darashsb6385"; 
            const adminWhatsApp = "6281385516385";
            const bankAccount = "Seabank 901703344188 a.n Dara Saliha Hasibuan";
            // Placeholder gambar QRIS
            const qrisImageUrl = "https://placehold.co/400x600/0f172a/ffffff?text=Scan+QRIS+Di+Sini";

            // Tambahkan classType (default: private)
            const [formData, setFormData] = useState({ classType: 'private', name: '', wa: '', date: '', time: '', duration: 1 });

            // Fungsi untuk mendapatkan harga dinamis berdasarkan tipe kelas
            const getPricePerHour = (type) => type === 'private' ? 300000 : 130000;

            // Ambil data dari Firebase
            const fetchBookings = useCallback(async () => {
                try {
                    const response = await fetch(`${BASE_DB_URL}.json`);
                    const data = await response.json();
                    if (data) {
                        const loadedBookings = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        setBookings(loadedBookings);
                    } else {
                        setBookings([]);
                    }
                } catch (error) {
                    console.error("Gagal mengambil data antrean.");
                }
            }, []);

            useEffect(() => {
                fetchBookings();
                const interval = setInterval(fetchBookings, 5000);
                return () => clearInterval(interval);
            }, [fetchBookings]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) {
                    setIsAdminAuthenticated(true);
                    setView('admin');
                    setShowPassError(false);
                } else {
                    setShowPassError(true);
                }
            };

            const handleBooking = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                const newBooking = { ...formData, timestamp: Date.now(), status: 'Menunggu Konfirmasi' };
                
                try {
                    const response = await fetch(`${BASE_DB_URL}.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newBooking)
                    });
                    if (response.ok) {
                        setSuccessData(newBooking);
                        fetchBookings();
                    }
                } catch (error) {
                    alert("Koneksi bermasalah.");
                }
                setIsLoading(false);
            };

            const updateStatus = async (id, newStatus) => {
                const oldBookings = [...bookings];
                setBookings(bookings.map(b => b.id === id ? {...b, status: newStatus} : b));

                try {
                    await fetch(`${BASE_DB_URL}/${id}.json`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });
                } catch (err) {
                    setBookings(oldBookings);
                    alert("Gagal memperbarui status.");
                }
            };

            const deleteBooking = async (id, isSelesai = false) => {
                const confirmMsg = isSelesai ? "Tandai selesai & hapus permanen?" : "Hapus pesanan ini secara permanen?";
                if(window.confirm(confirmMsg)) {
                    const oldBookings = [...bookings];
                    setBookings(bookings.filter(b => b.id !== id));

                    try {
                        const response = await fetch(`${BASE_DB_URL}/${id}.json`, { 
                            method: 'DELETE' 
                        });
                        if (!response.ok) throw new Error();
                    } catch (err) {
                        setBookings(oldBookings);
                        alert("Gagal menghapus antrean dari server.");
                    }
                }
            };

            const handleWhatsApp = () => {
                const totalBiaya = successData.duration * getPricePerHour(successData.classType);
                const tipeKelas = successData.classType === 'private' ? 'Private Class' : 'Open Class';
                const message = `Halo Admin! Saya ${successData.name} mau request jadwal tenis:%0A%0AJenis Kelas: ${tipeKelas}%0ATanggal: ${successData.date}%0AJam: ${successData.time}%0ADurasi: ${successData.duration} Jam%0ATotal Biaya: Rp ${totalBiaya.toLocaleString('id-ID')}%0A%0AApakah slotnya tersedia?`;
                window.open(`https://wa.me/${adminWhatsApp}?text=${message}`, '_blank');
                // Reset form setelah WA
                setFormData({ classType: 'private', name: '', wa: '', date: '', time: '', duration: 1 });
                setSuccessData(null);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Modal QRIS */}
                    {showQrModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-navy/90 backdrop-blur-sm" onClick={() => setShowQrModal(false)}>
                            <div className="relative max-w-sm w-full bg-white rounded-3xl p-2 animate-fade-in shadow-2xl" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setShowQrModal(false)} className="absolute top-4 right-4 bg-navy/50 text-white p-2 rounded-full"><Icon name="x"/></button>
                                <img src={qrisImageUrl} className="w-full h-auto rounded-2xl" alt="QRIS" />
                                <div className="p-4 text-center font-black uppercase text-navy">QRIS DJABEADS</div>
                            </div>
                        </div>
                    )}

                    <nav className="bg-navy text-white shadow-xl sticky top-0 z-50">
                        <div className="max-w-5xl mx-auto px-6 py-5 flex justify-between items-center">
                            <div className="text-2xl font-900 tracking-tighter uppercase cursor-pointer" onClick={() => {setView('client'); setSuccessData(null);}}>MAIN TENIS AJA</div>
                            <div className="flex bg-white/10 p-1 rounded-xl">
                                <button onClick={() => {setView('client'); setSuccessData(null);}} className={`px-5 py-2 rounded-lg text-xs font-bold transition ${view === 'client' ? 'bg-river text-white shadow-lg' : 'hover:bg-white/5'}`}>Booking</button>
                                <button onClick={() => isAdminAuthenticated ? setView('admin') : setView('login')} className={`px-5 py-2 rounded-lg text-xs font-bold transition ${view !== 'client' ? 'bg-river text-white shadow-lg' : 'hover:bg-white/5'}`}>Admin</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-5xl mx-auto p-6 md:p-10 flex-grow w-full">
                        {view === 'client' && (
                            <div className="flex flex-col md:flex-row gap-12 items-start animate-fade-in">
                                <div className="flex-1 space-y-8 text-center md:text-left">
                                    <h1 className="text-6xl md:text-8xl font-black leading-[0.85] tracking-tighter uppercase text-navy">MAIN<br/>TENIS<br/><span className="text-highland">AJA.</span></h1>
                                    <div className="bg-red-600 text-white p-5 rounded-2xl text-xs font-bold uppercase tracking-wider max-w-sm mx-auto md:mx-0 shadow-lg">
                                        <div className="flex items-center gap-2 mb-1"><Icon name="alert-triangle" size={14}/> INFO JADWAL</div>
                                        Weekend jadwal sangat sulit/penuh. Disarankan ambil Weekday. Jam sore paling direkomendasikan.
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <div className="text-4xl font-black italic text-navy">Rp 300.000 <span className="text-sm font-bold text-slate-400 uppercase not-italic">/ Jam (Private)</span></div>
                                        <div className="text-2xl font-black italic text-river">Rp 130.000 <span className="text-sm font-bold text-slate-400 uppercase not-italic">/ Jam (Open Class)</span></div>
                                    </div>
                                </div>

                                {successData ? (
                                    <div className="w-full md:w-[440px] bg-white rounded-[2.5rem] shadow-2xl p-10 text-center border-t-8 border-highland animate-fade-in">
                                        <div className="text-highland mb-6 flex justify-center"><Icon name="check-circle" size={80} /></div>
                                        <h2 className="text-2xl font-black uppercase mb-3 text-navy">Terkirim!</h2>
                                        <p className="text-sm text-slate-500 mb-8 font-medium">Data sudah masuk. Klik tombol WhatsApp untuk konfirmasi ke admin.</p>
                                        <button onClick={handleWhatsApp} className="w-full bg-highland text-white font-black py-5 rounded-2xl flex items-center justify-center gap-3 uppercase text-lg shadow-xl hover:scale-[1.02] active:scale-95 transition">WhatsApp Admin <Icon name="message-circle" /></button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleBooking} className="w-full md:w-[440px] bg-white rounded-[3rem] shadow-2xl p-8 md:p-10 space-y-6 border border-slate-100">
                                        <h2 className="text-xl font-black uppercase flex items-center gap-2 text-navy"><Icon name="calendar-days" className="text-river"/> Request Jadwal</h2>
                                        
                                        {/* Fitur Pilihan Jenis Kelas */}
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest px-2">Jenis Kelas</label>
                                            <div className="flex gap-2">
                                                <button type="button" onClick={() => setFormData({...formData, classType: 'private'})} className={`flex-1 py-3 rounded-xl font-black transition ${formData.classType === 'private' ? 'bg-navy text-white shadow-md' : 'bg-slate-50 text-slate-400 border border-slate-200'}`}>Private</button>
                                                <button type="button" onClick={() => setFormData({...formData, classType: 'open'})} className={`flex-1 py-3 rounded-xl font-black transition ${formData.classType === 'open' ? 'bg-navy text-white shadow-md' : 'bg-slate-50 text-slate-400 border border-slate-200'}`}>Open Class</button>
                                            </div>
                                        </div>

                                        <input required placeholder="Nama Lengkap" className="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-200 focus:border-river font-bold mt-2" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                        <input required type="tel" placeholder="Nomor WhatsApp" className="w-full bg-slate-50 p-4 rounded-2xl outline-none border border-slate-200 focus:border-river font-bold" value={formData.wa} onChange={e => setFormData({...formData, wa: e.target.value})} />
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest px-2">Tanggal</label>
                                                <input required type="date" className="w-full bg-slate-50 p-4 rounded-2xl font-bold text-sm border border-slate-200" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest px-2">Jam</label>
                                                <input required type="time" className="w-full bg-slate-50 p-4 rounded-2xl font-bold text-sm border border-slate-200" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} />
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest px-2">Durasi</label>
                                            <div className="flex gap-2">
                                                {[1, 2, 3].map(h => (
                                                    <button key={h} type="button" onClick={() => setFormData({...formData, duration: h})} className={`flex-1 py-3 rounded-xl font-black transition ${formData.duration === h ? 'bg-navy text-white' : 'bg-slate-50 text-slate-300 border border-slate-200'}`}>{h} Jam</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="bg-navy p-7 rounded-[2.5rem] text-white">
                                            <div className="flex justify-between font-black uppercase mb-5 border-b border-white/10 pb-3">
                                                <span className="text-xs opacity-50 flex items-center">Total Biaya</span>
                                                <span className="text-xl">Rp {(formData.duration * getPricePerHour(formData.classType)).toLocaleString('id-ID')}</span>
                                            </div>
                                            <div className="space-y-4">
                                                <div className="bg-white/5 p-4 rounded-xl text-[11px] font-bold text-slate-300">{bankAccount}</div>
                                                <button type="button" onClick={() => setShowQrModal(true)} className="w-full py-3 bg-river rounded-xl text-white font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
                                                    <Icon name="qr-code" size={14}/> Scan QRIS
                                                </button>
                                            </div>
                                        </div>
                                        <button disabled={isLoading} className="w-full bg-highland text-white font-black py-5 rounded-2xl uppercase tracking-tighter hover:opacity-90 transition shadow-xl text-lg">
                                            {isLoading ? "Mengirim..." : "Pesan Slot Sekarang"}
                                        </button>
                                    </form>
                                )}
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="max-w-md mx-auto mt-20 p-12 bg-white rounded-[3rem] shadow-2xl text-center border-t-8 border-navy animate-fade-in">
                                <div className="bg-slate-100 text-navy w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6"><Icon name="shield" size={32}/></div>
                                <h2 className="text-2xl font-black uppercase mb-8 text-navy">Admin Access</h2>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <input type="password" placeholder="Password" className="w-full bg-slate-50 p-4 rounded-2xl text-center font-bold outline-none border border-slate-200 focus:border-river" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} />
                                    {showPassError && <p className="text-red-500 text-[10px] font-black uppercase">Password Salah!</p>}
                                    <button className="w-full bg-navy text-white font-black py-4 rounded-2xl uppercase tracking-widest text-xs active:scale-95 transition">Unlock</button>
                                </form>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="flex justify-between items-end bg-navy p-8 rounded-[3rem] text-white shadow-2xl">
                                    <div>
                                        <h2 className="text-4xl font-black uppercase tracking-tighter leading-none mb-2">Antrean<br/>Pesanan</h2>
                                        <button onClick={() => setIsAdminAuthenticated(false)} className="bg-white/10 px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-red-500 transition flex items-center gap-2"><Icon name="log-out" size={12}/> Keluar</button>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[10px] font-black uppercase opacity-50 tracking-widest">Total</p>
                                        <p className="text-5xl font-black text-river leading-none">{bookings.length}</p>
                                    </div>
                                </div>

                                <div className="grid gap-5">
                                    {bookings.map(b => (
                                        <div key={b.id} className="bg-white p-6 rounded-[2.5rem] shadow-md border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden transition-all hover:shadow-lg">
                                            <div className={`absolute left-0 inset-y-0 w-3 ${b.status === 'Jadwal Aman' ? 'bg-highland' : (b.status === 'Menunggu Konfirmasi' ? 'bg-amber-400' : 'bg-slate-300')}`}></div>
                                            <div className="flex-1 flex gap-6 items-center w-full">
                                                <div className="bg-slate-100 p-5 rounded-2xl text-center min-w-[100px] font-black uppercase border border-slate-200">
                                                    <div className="text-2xl text-navy">{b.date?.split('-')[2]}</div>
                                                    <div className="text-[11px] text-slate-400 uppercase">{new Date(b.date).toLocaleString('id-ID', {month: 'short'})}</div>
                                                </div>
                                                <div className="flex-1">
                                                    <h3 className="font-black text-2xl uppercase tracking-tight text-navy">{b.name}</h3>
                                                    <div className="flex flex-wrap gap-4 mt-2 text-[12px] font-bold text-slate-400 uppercase">
                                                        <span className="bg-river text-white px-3 py-1 rounded-full flex items-center gap-1 shadow-sm"><Icon name="users" size={14}/> {b.classType === 'private' ? 'Private' : 'Open Class'}</span>
                                                        <span className="bg-slate-50 px-3 py-1 rounded-full text-slate-500 border border-slate-200"><Icon name="clock" size={14} className="inline mb-0.5 mr-1"/> {b.time} ({b.duration}h)</span>
                                                        <a href={`https://wa.me/${b.wa?.replace(/^0/, '62')}`} target="_blank" className="text-river bg-blue-50 px-3 py-1 rounded-full hover:bg-river hover:text-white transition"><Icon name="phone" size={14} className="inline mb-0.5 mr-1"/> {b.wa}</a>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                                                <div className="grid grid-cols-2 gap-2 w-full md:w-auto">
                                                    <button onClick={() => updateStatus(b.id, 'Menunggu Konfirmasi')} className={`px-4 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${b.status === 'Menunggu Konfirmasi' ? 'bg-amber-400 text-navy shadow-md' : 'bg-slate-50 text-slate-300 border border-slate-200'}`}>Menunggu</button>
                                                    <button onClick={() => updateStatus(b.id, 'Jadwal Aman')} className={`px-4 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${b.status === 'Jadwal Aman' ? 'bg-highland text-white shadow-md' : 'bg-slate-50 text-slate-300 border border-slate-200'}`}>Aman</button>
                                                </div>
                                                <div className="flex items-center gap-2 w-full md:w-auto">
                                                    <button onClick={() => deleteBooking(b.id, true)} className="flex-1 md:flex-none px-6 py-3 rounded-xl text-[11px] font-black uppercase bg-navy text-white hover:bg-highland transition shadow-lg flex items-center justify-center gap-2 active:scale-95">
                                                        <Icon name="check" size={16} /> Selesai
                                                    </button>
                                                    <button onClick={() => deleteBooking(b.id, false)} className="p-3 text-slate-300 hover:text-red-500 transition-colors bg-slate-50 rounded-xl border border-slate-100">
                                                        <Icon name="trash-2" size={20} />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {bookings.length === 0 && (
                                        <div className="text-center py-28 text-slate-300 bg-white rounded-[3rem] border-4 border-dashed border-slate-100">
                                            <Icon name="layout-list" size={60} className="mx-auto mb-4 opacity-10"/>
                                            <p className="font-black uppercase tracking-widest text-sm">Antrean Kosong</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="py-12 bg-navy text-white/30 text-center">
                        <div className="text-xl font-black uppercase tracking-tighter mb-2">MAIN TENIS AJA</div>
                        <p className="text-[10px] font-bold uppercase tracking-[0.4em]">Realtime Sync Active</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
