```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIN TENIS AJA - Realtime Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // KONFIGURASI DATABASE
        const DATABASE_URL = "https://main-tenis-database-default-rtdb.firebaseio.com/bookings.json";

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className} style={{width: size, height: size}}></i>;
        };

        const App = () => {
            const [view, setView] = useState('client');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showPassError, setShowPassError] = useState(false);
            const [showQrModal, setShowQrModal] = useState(false);
            const [successData, setSuccessData] = useState(null);
            const [bookings, setBookings] = useState([]);
            const [isLoading, setIsLoading] = useState(false);

            const ADMIN_PASSWORD = "darashsb6385"; 
            const pricePerHour = 300000;
            const adminWhatsApp = "6281385516385";
            const bankAccount = "Seabank 901703344188 a.n Dara Saliha Hasibuan";
            const qrisImageUrl = "qris.jpg";

            const [formData, setFormData] = useState({ name: '', wa: '', date: '', time: '', duration: 1 });

            // AMBIL DATA DARI FIREBASE
            const fetchBookings = async () => {
                try {
                    const response = await fetch(DATABASE_URL);
                    const data = await response.json();
                    if (data) {
                        const loadedBookings = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        })).reverse();
                        setBookings(loadedBookings);
                    } else {
                        setBookings([]);
                    }
                } catch (error) {
                    console.error("Gagal mengambil data:", error);
                }
            };

            useEffect(() => {
                fetchBookings();
                const interval = setInterval(fetchBookings, 10000); // Auto-refresh tiap 10 detik
                return () => clearInterval(interval);
            }, []);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) {
                    setIsAdminAuthenticated(true);
                    setView('admin');
                    setShowPassError(false);
                } else {
                    setShowPassError(true);
                }
            };

            const handleBooking = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                const newBooking = { ...formData, timestamp: Date.now(), status: 'Menunggu Konfirmasi' };
                
                try {
                    const response = await fetch(DATABASE_URL, {
                        method: 'POST',
                        body: JSON.stringify(newBooking)
                    });
                    if (response.ok) {
                        setSuccessData(newBooking);
                        fetchBookings();
                    }
                } catch (error) {
                    alert("Gagal mengirim pesanan. Cek koneksi internet.");
                }
                setIsLoading(false);
            };

            const updateStatus = async (id, newStatus) => {
                const singleUrl = `https://main-tenis-database-default-rtdb.firebaseio.com/bookings/${id}.json`;
                await fetch(singleUrl, {
                    method: 'PATCH',
                    body: JSON.stringify({ status: newStatus })
                });
                fetchBookings();
            };

            const deleteBooking = async (id) => {
                if(window.confirm("Hapus pesanan ini secara permanen?")) {
                    const singleUrl = `https://main-tenis-database-default-rtdb.firebaseio.com/bookings/${id}.json`;
                    await fetch(singleUrl, { method: 'DELETE' });
                    fetchBookings();
                }
            };

            const handleWhatsApp = () => {
                const totalBiaya = successData.duration * pricePerHour;
                const message = `Halo Admin! Saya ${successData.name} mau request jadwal tenis:%0A%0ATanggal: ${successData.date}%0AJam: ${successData.time}%0ADurasi: ${successData.duration} Jam%0ATotal Biaya: Rp ${totalBiaya.toLocaleString('id-ID')}%0A%0AApakah slotnya tersedia?`;
                window.open(`https://wa.me/${adminWhatsApp}?text=${message}`, '_blank');
                setFormData({ name: '', wa: '', date: '', time: '', duration: 1 });
                setSuccessData(null);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* QRIS Modal */}
                    {showQrModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={() => setShowQrModal(false)}>
                            <div className="relative max-w-sm w-full bg-white rounded-3xl p-2" onClick={e => e.stopPropagation()}>
                                <img src={qrisImageUrl} className="w-full h-auto rounded-2xl" alt="QRIS" />
                                <div className="p-4 text-center font-black uppercase">QRIS DJABEADS</div>
                            </div>
                        </div>
                    )}

                    <nav className="bg-emerald-600 text-white sticky top-0 z-50 shadow-md">
                        <div className="max-w-5xl mx-auto px-6 py-5 flex justify-between items-center">
                            <div className="text-2xl font-900 tracking-tighter uppercase cursor-pointer" onClick={() => setView('client')}>MAIN TENIS AJA</div>
                            <div className="flex bg-black/10 p-1 rounded-full">
                                <button onClick={() => setView('client')} className={`px-6 py-1.5 rounded-full text-xs font-bold ${view === 'client' ? 'bg-white text-emerald-700' : ''}`}>Booking</button>
                                <button onClick={() => isAdminAuthenticated ? setView('admin') : setView('login')} className={`px-6 py-1.5 rounded-full text-xs font-bold ${view !== 'client' ? 'bg-white text-emerald-700' : ''}`}>Admin</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-5xl mx-auto p-6 md:p-10 flex-grow w-full">
                        {view === 'client' && (
                            <div className="flex flex-col md:flex-row gap-12 items-start animate-fade-in">
                                <div className="flex-1 space-y-8 text-center md:text-left">
                                    <h1 className="text-6xl md:text-8xl font-black leading-[0.85] tracking-tighter uppercase">MAIN<br/>TENIS<br/><span className="text-emerald-600">AJA.</span></h1>
                                    <div className="bg-amber-50 border border-amber-100 p-5 rounded-2xl text-amber-700 text-xs font-bold uppercase tracking-wider">
                                        Weekend biasanya penuh, disarankan weekday untuk respon cepat.
                                    </div>
                                    <div className="text-4xl font-black italic">Rp 300.000 <span className="text-sm font-bold text-slate-400 uppercase not-italic">/ Jam</span></div>
                                </div>

                                {successData ? (
                                    <div className="w-full md:w-[400px] bg-white rounded-[2.5rem] shadow-xl p-8 text-center border-2 border-emerald-500 animate-fade-in">
                                        <div className="text-emerald-500 mb-4"><Icon name="check-circle" size={64} className="mx-auto" /></div>
                                        <h2 className="text-2xl font-black uppercase mb-4">Berhasil Terkirim!</h2>
                                        <p className="text-sm text-slate-500 mb-6 font-medium">Data sudah masuk ke Dashboard Admin. Silakan konfirmasi via WhatsApp.</p>
                                        <button onClick={handleWhatsApp} className="w-full bg-emerald-600 text-white font-black py-5 rounded-2xl flex items-center justify-center gap-2 uppercase tracking-tighter">Hubungi Admin <Icon name="message-circle" /></button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleBooking} className="w-full md:w-[400px] bg-white rounded-[2.5rem] shadow-xl p-8 space-y-5 border border-slate-100">
                                        <h2 className="text-xl font-black uppercase flex items-center gap-2"><Icon name="calendar" className="text-emerald-500"/> Isi Jadwal</h2>
                                        <input required placeholder="Nama Lengkap" className="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 font-bold" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                        <input required type="tel" placeholder="Nomor WhatsApp" className="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 font-bold" value={formData.wa} onChange={e => setFormData({...formData, wa: e.target.value})} />
                                        <div className="grid grid-cols-2 gap-3">
                                            <input required type="date" className="bg-slate-50 p-4 rounded-2xl font-bold text-sm" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                                            <input required type="time" className="bg-slate-50 p-4 rounded-2xl font-bold text-sm" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} />
                                        </div>
                                        <div className="flex gap-2">
                                            {[1, 2, 3].map(h => (
                                                <button key={h} type="button" onClick={() => setFormData({...formData, duration: h})} className={`flex-1 py-3 rounded-xl font-black ${formData.duration === h ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-300'}`}>{h} Jam</button>
                                            ))}
                                        </div>
                                        <div className="bg-slate-900 p-6 rounded-3xl text-white">
                                            <div className="flex justify-between font-black uppercase italic mb-4"><span>Total</span><span>Rp {(formData.duration * pricePerHour).toLocaleString('id-ID')}</span></div>
                                            <button type="button" onClick={() => setShowQrModal(true)} className="w-full py-3 bg-white/10 rounded-xl text-[10px] font-black uppercase tracking-widest border border-white/10">Lihat QRIS DJABEADS</button>
                                        </div>
                                        <button disabled={isLoading} className="w-full bg-emerald-600 text-white font-black py-5 rounded-2xl uppercase tracking-tighter hover:bg-emerald-700 transition">
                                            {isLoading ? "Mengirim..." : "Pesan Sekarang"}
                                        </button>
                                    </form>
                                )}
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="max-w-md mx-auto mt-20 p-10 bg-white rounded-[2.5rem] shadow-xl text-center">
                                <h2 className="text-2xl font-black uppercase mb-8">Admin Access</h2>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <input type="password" placeholder="Password" className="w-full bg-slate-50 p-4 rounded-2xl text-center font-bold" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} />
                                    <button className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl uppercase">Unlock</button>
                                </form>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black uppercase">Dashboard</h2>
                                    <div className="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-full text-xs font-black uppercase tracking-widest">Live Updates On</div>
                                </div>
                                <div className="grid gap-4">
                                    {bookings.map(b => (
                                        <div key={b.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col md:flex-row items-center justify-between gap-6">
                                            <div className="flex gap-6 items-center flex-1 w-full">
                                                <div className="bg-slate-50 p-4 rounded-2xl text-center min-w-[80px] font-black uppercase">
                                                    <div className="text-lg">{b.date?.split('-')[2]}</div>
                                                    <div className="text-[8px] text-slate-400">{new Date(b.date).toLocaleString('id-ID', {month: 'short'})}</div>
                                                </div>
                                                <div>
                                                    <h3 className="font-black text-xl uppercase">{b.name}</h3>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase">{b.time} • {b.duration} Jam • <a href={`https://wa.me/${b.wa}`} target="_blank" className="text-emerald-600 underline">{b.wa}</a></p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={() => updateStatus(b.id, 'Jadwal Aman')} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase ${b.status === 'Jadwal Aman' ? 'bg-emerald-500 text-white' : 'bg-slate-50 text-slate-300'}`}>Aman</button>
                                                <button onClick={() => deleteBooking(b.id)} className="p-2 text-red-200 hover:text-red-500"><Icon name="trash-2" /></button>
                                            </div>
                                        </div>
                                    ))}
                                    {bookings.length === 0 && <p className="text-center py-20 text-slate-300 font-black uppercase">Belum ada pesanan.</p>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>


```
